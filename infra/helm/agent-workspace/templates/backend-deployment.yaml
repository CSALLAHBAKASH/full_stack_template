apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-workspace.fullname" . }}-backend
  labels:
    {{- include "agent-workspace.backendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "agent-workspace.backendLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: APP_ENV
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: FRONTEND_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: CORS_ORIGINS
            - name: PASSWORD_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: PASSWORD_AUTH_ENABLED
            - name: SESSION_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: SESSION_TTL_SECONDS
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: OIDC_CLIENT_ID
            - name: OIDC_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent-workspace.fullname" . }}-config
                  key: OIDC_REDIRECT_URI
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
