apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-workspace.fullname" . }}-backend
  labels:
    {{- include "agent-workspace.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
