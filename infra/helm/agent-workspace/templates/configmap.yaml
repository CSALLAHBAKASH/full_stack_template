apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-config
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  APP_ENV: "production"
  FRONTEND_URL: {{ .Values.frontendUrl | quote }}
  CORS_ORIGINS: {{ .Values.corsOrigins | quote }}
  PASSWORD_AUTH_ENABLED: {{ .Values.passwordAuthEnabled | quote }}
  SESSION_TTL_SECONDS: {{ .Values.sessionTtlSeconds | quote }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  BACKEND_INTERNAL_URL: {{ printf "http://%s-backend:%v" (include "agent-workspace.fullname" .) .Values.backend.service.port | quote }}
