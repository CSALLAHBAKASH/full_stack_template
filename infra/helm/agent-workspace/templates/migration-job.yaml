apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-workspace.fullname" . }}-migrate
  labels:
    {{- include "agent-workspace.backendLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "agent-workspace.backendLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: APP_ENV
              value: "production"
            - name: FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.corsOrigins | quote }}
            - name: PASSWORD_AUTH_ENABLED
              value: {{ .Values.passwordAuthEnabled | quote }}
            - name: SESSION_TTL_SECONDS
              value: {{ .Values.sessionTtlSeconds | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
